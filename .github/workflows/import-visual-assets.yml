# Creator: Beriman Juliano
name: Collect visual review evidence
on:
  push:
    branches: [visual-refresh-20261021]
    paths: [.github/workflows/import-visual-assets.yml]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Retrieve review archives
        run: |
          mkdir -p review
          curl --fail --location 'https://sb-3cv45chsdcto.vercel.run/visual-qa.zip' -o review/visual-qa.zip
          curl --fail --location 'https://sb-3cv45chsdcto.vercel.run/source-update.zip' -o review/source-update.zip
          echo '3c0f1c4c2445722033dbe6d8ed13db78ac6110a5bd7f3dc8db3b1103c268a862  review/visual-qa.zip' | sha256sum --check
          echo '6a2fe6bcc553564a7ddc5c9a5f02cf0fef2780d3e53b93b94433352dc0b478fc  review/source-update.zip' | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: cind3rella-visual-review
          path: review/
          retention-days: 7
