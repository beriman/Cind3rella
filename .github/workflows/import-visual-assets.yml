# Creator: Beriman Juliano
name: Apply tested visual edition
on:
  push:
    branches: [visual-refresh-20261021]
    paths: [.github/workflows/import-visual-assets.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-refresh-20261021
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and apply reviewed source patch
        run: |
          set -euo pipefail
          curl --fail --location 'https://sb-3cv45chsdcto.vercel.run/visual-update.patch' -o /tmp/visual-update.patch
          echo 'f121567834a21521122a23c5c45104ff355d5dd69ff16dd90ca5a02e636940bc  /tmp/visual-update.patch' | sha256sum --check
          git apply --check /tmp/visual-update.patch
          git apply /tmp/visual-update.patch
          git diff --check
      - name: Build verified source
        run: npm ci --ignore-scripts && npm run build
      - name: Commit visual edition to review branch
        run: |
          git config user.name 'Beriman Juliano'
          git config user.email '22643215+beriman@users.noreply.github.com'
          git add index.html package.json package-lock.json README.md docs/ASSETS.md docs/RESEARCH.md src/main.ts src/gallery.ts src/visual.css scripts/verify-ui.mjs public/images/2026/manifest.json
          git commit -m 'Build cinematic hero and ten-image editorial gallery'
          git push origin HEAD:visual-refresh-20261021
